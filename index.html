<!doctype html>
<html>

<head>
  <title>QArt.js Example</title>
  <style>
    body {
      font-family: sans-serif;
      width: 100%;
      padding: 20px;
      background-color: #383827;
      color: #eee; /* Light text for better contrast */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1, h2 {
      text-align: center;
    }

    /* Container for the form and output */
    .container {
      background-color: #282817; /* Slightly darker background for container */
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      max-width: 800px;
      width: 100%;
    }

    label {
      display: block;
      margin-bottom: 10px;
    }

    input[type="text"],
    input[type="number"],
    textarea {
      width: calc(100% - 22px); /* Adjust for padding */
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
      background-color: #181807; /* Darker background for inputs */
      color: #eee;
    }

    select,
    input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 10px;
      border: 1px solid #555;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
      background-color: #181807;
      color: #eee;
    }

    /* Style the file input */
    input[type="file"] {
      /* Add your desired styles here */
    }

    /* Group radio buttons */
    .radio-group {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .radio-group label {
      margin-right: 15px;
    }

    /* Output display */
    .output {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    #qr, #combine {
      margin: 10px;
      border: 1px solid #555;
      border-radius: 4px;
    }

    /* Responsive design */
    @media (max-width: 600px) {
      .container {
        padding: 10px;
      }

      input[type="text"],
      input[type="number"],
      textarea {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QArt.js</h1>

    <h2>From</h2>
    <label for="value">Value:</label>
    <textarea id="value" rows="3" cols="45">https://github.com/kciter/qart.js</textarea>

    <label for="bg">Background:</label>
    <input id="bg" type="text" value="#C2C">

    <label for="size">Size:</label>
    <input id="size" type="number" value="195">

    <label for="version">Version:</label>
    <input id="version" type="number" value="10">

    <label for="fillType">Fill type:</label>
    <select id="fillType" name="fillType">
      <option value="fill">Fill</option>
      <option value="scale_to_fit">Scale to fit</option>
    </select>

    <label for="file">Image:</label>
    <input id="file" type="file">

    <div class="radio-group">
      <label>
        Threshold: <input type="radio" value="threshold" name="filter">
      </label>
      <label>
        Color: <input type="radio" value="color" name="filter" checked>
      </label>
    </div>

    <div class="output">
      <div id="qr"></div>
      <div id="image"><img src="./example.png" width="171"></div>
    </div>

    <h2>To</h2>
    <div class="output">
      <div id="combine"></div>
    </div>
  </div>

  <script src="./qrcode.js"></script>
  <script src="./qart.min.js"></script>
  <script src="https://code.jquery.com/jquery-2.2.4.min.js"></script>
  <script>
    $(document).ready(function () {
      var value = 'https://github.com/kciter/qart.js';
      // make color prioritized
      var filter = 'color';
      // end change
      var imagePath = './example.png';
      var version = 10;
      var imageSize = 75 + (version * 12) - 24;
      var bg = "#C2C";
      var size = "175";
      // change to fill by default
      var fillType = 'fill';
      // end change
      var self = this;

      $('#image img').width(imageSize);

      function makeQR() {
        // console.log('Current version:', version)
        // qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
        var qr = qrcode.QRCode(version, 'H');
        qr.addData(value);
        try {
          qr.make();
        } catch (err) {
          console.log('Version is low:', version)
          console.log('Error:', err)
        }
        document.getElementById('qr').innerHTML = qr.createImgTag(3);
      }

      function makeQArt() {
        new QArt({
          value: value,
          imagePath: imagePath,
          filter: filter,
          version: version,
          background: bg,
          size: size,
          fillType: fillType
        }).make(document.getElementById('combine'));
      }

      function getBase64(file, callback) {
        var reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function () {
          callback(reader.result);
        };
      }

      $('#value').keyup(function () {
        value = $(this).val();
        makeQR();
        makeQArt();
      });

      $('#bg').keyup(function () {
        bg = $(this).val();
        makeQArt();
      });

      $('#size').keyup(function () {
        size = $(this).val();
        makeQArt();
      });

      $('#fillType').bind('change', function () {
        fillType = $(this).val();
        makeQArt();
      });


      $('#version').bind('keyup change click', function () {
        console.log($('#version').val());
        version = $('#version').val();
        imageSize = 75 + (version * 12) - 24;
        $('#image img').width(imageSize);
        makeQR();
        makeQArt();
      });

      $('#file').change(function () {
        getBase64(this.files[0], function (base64Img) {
          var regex = /data:(.*);base64,(.*)/gm;
          var parts = regex.exec(base64Img);
          imagePath = parts[0];
          $('#image img').attr('src', imagePath);
          makeQArt();
        });
      });
      // CHANGE = allow for pasting images
      document.body.onpaste = (e) => {
        let cd = e.clipboardData;
        let imageF = null;
         for (let i = 0; i < cd.items.length; i++) {
             imageF = cd.items[i].getAsFile();
             if (imageF) break;
        }
        if (!imageF) return alert("failed to load image from clipboard");

        getBase64(imageF, function (base64Img) {
          var regex = /data:(.*);base64,(.*)/gm;
          var parts = regex.exec(base64Img);
          imagePath = parts[0];
          $('#image img').attr('src', imagePath);
          makeQArt();
        });
      }
      // ENDCHANGE

      $('input[type=radio]').click(function () {
        filter = $(this).val();
        makeQArt();
      });

      makeQR();
      makeQArt();
    });
  </script>

  <body>

</html>
